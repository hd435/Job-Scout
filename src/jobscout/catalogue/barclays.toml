# Barclays runs Workday. The external board holds thousands of postings, so the site's own
# search keeps a scan bounded; a role whose title never says "graduate" is not seen (D-080).
id = "barclays"
employer = "Barclays"
adapter = "workday"
access_note = "public Workday careers site (CXS API at barclays.wd3.myworkdayjobs.com), listing POST plus bounded detail requests, page cap 200, narrowed by the site's own `graduate` search"
cadence_minutes = 30

[options]
host = "barclays.wd3.myworkdayjobs.com"
tenant = "barclays"
site = "External_Career_Site_Barclays"
locale = "en-US"
search_text = "graduate"
uk_employer = true
